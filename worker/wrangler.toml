name = "vespera-ridge-demo"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# ####
# THIS IS A FICTIONAL DEMO.
# ALL INFORMATION HERE IS MADE UP. NO REAL CREDENTIALS HERE. Sorry… :-)
# ####

# Custom domain (zone ironalloy.info must be in this Cloudflare account, on Cloudflare DNS).
routes = [{ pattern = "defensive-prompt.ironalloy.info", custom_domain = true }]

[assets]
directory = "../web"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "vr_db"
database_id = "69679ebd-9af2-487f-b89e-6115b608261b"

[[durable_objects.bindings]]
name = "CONTROL"
class_name = "Control"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Control"]

[vars]
DEFAULT_MODEL = "gemma4:31b"
ALLOWED_MODELS = "deepseek-v4.1-flash,nemotron-3-nano:30b,gpt-oss:20b,gemma4:31b"
MAX_INPUT_CHARS = "1200"
MAX_OUTPUT_TOKENS = "500"
MAX_TOOL_STEPS = "4"
DAILY_TOKEN_BUDGET = "8000000"
